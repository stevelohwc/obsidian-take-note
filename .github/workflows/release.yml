# Builds the plugin from the tagged source, attests the build provenance of the release
# assets, and publishes them. Release by pushing a tag equal to the manifest version,
# and push main only after this run finishes: Obsidian reads manifest.json from main,
# and a version there with no release yet shows as an error in the directory.
#   git tag 1.3.7 && git push origin 1.3.7
#   gh run watch && git push origin main
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # sign the attestation
  attestations: write # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Tag must match manifest version
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
